# PostgreSQL Configuration for Primary Node (Node 1)
# These settings should be added to postgresql.conf on the primary server

# ---------------------------
# REPLICATION SETTINGS
# ---------------------------

# Enable WAL archiving and streaming replication
wal_level = replica                    # minimal, replica, or logical
max_wal_senders = 3                    # max number of walsender processes
wal_keep_size = 1024                   # in megabytes; 0 disables
max_replication_slots = 3              # max number of replication slots

# ---------------------------
# WRITE AHEAD LOG
# ---------------------------

# WAL writing
fsync = on                             # flush data to disk
synchronous_commit = on                # synchronization level
wal_sync_method = fsync                # method for synchronizing updates to disk

# Checkpoints
checkpoint_timeout = 5min              # range 30s-1d
checkpoint_completion_target = 0.9     # checkpoint target duration, 0.0 - 1.0
max_wal_size = 1GB
min_wal_size = 80MB

# ---------------------------
# CONNECTIONS
# ---------------------------

listen_addresses = '*'                 # listen on all interfaces
port = 5432                           # default PostgreSQL port
max_connections = 100                  # maximum number of client connections

# ---------------------------
# AUTHENTICATION
# ---------------------------

# Note: Also configure pg_hba.conf to allow replication connections:
# Add this line to pg_hba.conf:
# host    replication     replication_user    <replica_ip>/32    md5
