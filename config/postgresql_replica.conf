# PostgreSQL Configuration for Replica Node (Node 2)
# These settings should be added to postgresql.conf on the replica server

# ---------------------------
# REPLICATION SETTINGS
# ---------------------------

# Enable hot standby to allow read-only queries on replica
hot_standby = on                       # allows queries during recovery
hot_standby_feedback = on              # send info from standby to prevent query conflicts

# ---------------------------
# STANDBY SERVER SETTINGS
# ---------------------------

# These settings are only used on a standby server
primary_conninfo = 'host=<primary_host> port=5432 user=replication_user password=replication_password application_name=replica_node_2'
primary_slot_name = 'replica_node_1_slot'
restore_command = ''                   # command to restore WAL files (optional)

# ---------------------------
# WRITE AHEAD LOG
# ---------------------------

# WAL recovery
wal_retrieve_retry_interval = 5s       # time to wait before retrying to retrieve WAL
max_standby_streaming_delay = 30s      # max delay before canceling queries on replica

# ---------------------------
# CONNECTIONS
# ---------------------------

listen_addresses = '*'                 # listen on all interfaces
port = 5432                           # default PostgreSQL port
max_connections = 100                  # maximum number of client connections

# ---------------------------
# NOTE
# ---------------------------

# For PostgreSQL 12+, create a file named 'standby.signal' in the data directory
# to indicate this is a standby server. The presence of this file puts the server
# in standby mode.
