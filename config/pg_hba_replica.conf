# PostgreSQL Host-Based Authentication for Replica Node
# This file controls which hosts are allowed to connect to the database
# Add these lines to your pg_hba.conf file on the replica server

# TYPE  DATABASE        USER                ADDRESS                 METHOD

# Allow local connections
local   all             all                                         peer
host    all             all                 127.0.0.1/32           md5
host    all             all                 ::1/128                md5

# Allow read-only application connections to replica
host    bookstore_db    all                 0.0.0.0/0              md5
host    bookstore_db    all                 ::/0                   md5

# Note: Replica nodes typically don't need replication entries in pg_hba.conf
# as they are consumers, not providers of replication data
