# PostgreSQL Host-Based Authentication for Primary Node
# This file controls which hosts are allowed to connect to the database
# Add these lines to your pg_hba.conf file on the primary server

# TYPE  DATABASE        USER                ADDRESS                 METHOD

# Allow local connections
local   all             all                                         peer
host    all             all                 127.0.0.1/32           md5
host    all             all                 ::1/128                md5

# Allow replication connections from replica node
# Replace <replica_ip> with the actual IP address of your replica server
host    replication     replication_user    <replica_ip>/32        md5

# Allow application connections
host    bookstore_db    all                 0.0.0.0/0              md5
host    bookstore_db    all                 ::/0                   md5

# Example for specific replica IP (replace with your actual IP)
# host    replication     replication_user    192.168.1.100/32       md5
